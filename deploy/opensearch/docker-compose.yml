# OpenSearch lab — single node + Dashboards (courses opensearch-basic/intermediate)
# docker compose up -d

services:
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: mock-opensearch
    hostname: opensearch
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: mock-opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
    depends_on:
      opensearch:
        condition: service_healthy

  loggen:
    image: curlimages/curl:8.7.1
    container_name: mock-opensearch-loggen
    profiles: ["tools"]
    entrypoint: ["sleep", "infinity"]
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch-data:
