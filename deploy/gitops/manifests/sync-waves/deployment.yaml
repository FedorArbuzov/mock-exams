apiVersion: apps/v1
kind: Deployment
metadata:
  name: waves-demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waves-demo
  template:
    metadata:
      labels:
        app: waves-demo
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          env:
            - name: DEMO_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: waves-config
                  key: MESSAGE
          ports:
            - containerPort: 80
