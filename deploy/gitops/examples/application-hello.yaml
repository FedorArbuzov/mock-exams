# Один Application без app-of-apps. Подставьте repo URL:
#   source config/repo.env && envsubst < examples/application-hello.yaml | kubectl apply -f -
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-gitops-direct
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ${MOCK_GITOPS_REPO}
    targetRevision: ${MOCK_GITOPS_REVISION}
    path: deploy/gitops/manifests/hello-gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
