apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sync-waves
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/FedorArbuzov/mock-exams.git
    targetRevision: master
    path: deploy/gitops/manifests/sync-waves
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-waves
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
