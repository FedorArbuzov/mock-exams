# Course browser + interactive labs. Requires Docker Desktop Kubernetes on the host.
# Dev: scripts/dev-mockctl-web.ps1  /  scripts/dev-mockctl-web.sh
services:
  mockctl-web:
    image: ${MOCKCTL_WEB_IMAGE:-mock-exams/mockctl-web:local}
    build:
      context: ../..
      dockerfile: deploy/mockctl-web/Dockerfile
    container_name: mockctl-web
    ports:
      - "${MOCKCTL_WEB_PORT:-8091}:8091"
    volumes:
      # Host kubeconfig (127.0.0.1) — entrypoint rewrites for container networking.
      - ${HOME}/.mock-exams/kubeconfig.yaml:/kube/host-kubeconfig.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
