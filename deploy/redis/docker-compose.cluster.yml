# Redis Cluster — redis-advanced (3 masters + 3 replicas)
# docker compose -f docker-compose.cluster.yml up -d && bash scripts/init-cluster.sh
# Host: localhost:7001-7006 (-c for cluster mode)

x-redis-cluster: &redis-cluster
  image: redis:7.2-alpine
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 12

services:
  redis-1:
    <<: *redis-cluster
    container_name: mock-redis-cluster-1
    hostname: redis-1
    ports: ["7001:6379", "17001:16379"]
    command: >
      redis-server --port 6379 --bind 0.0.0.0 --protected-mode no
      --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-node-timeout 5000 --appendonly yes
      --cluster-announce-ip redis-1 --cluster-announce-port 6379
      --cluster-announce-bus-port 16379

  redis-2:
