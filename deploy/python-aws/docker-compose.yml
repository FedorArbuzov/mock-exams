# Python AWS labs: LocalStack + lab runner
services:
  localstack:
    image: localstack/localstack:3.8
    container_name: mock-python-aws-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,dynamodb,lambda,iam,sqs,sns,sts,logs,secretsmanager,events
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
      LAMBDA_DOCKER_NETWORK: mock-python-aws_backend
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - backend

  lab:
    build: ./stack
    container_name: mock-python-aws-lab
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      SHOP_BUCKET: shop-uploads
      SHOP_TABLE: shop-items
      SHOP_QUEUE: shop-events
    volumes:
      - ./stack:/app
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    name: mock-python-aws_backend

volumes:
  localstack-data:
