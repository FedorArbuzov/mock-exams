# HTTP edge — labs nginx-basic/intermediate
server {
    listen 80;
    server_name localhost lab.local;

    location /static/ {
        proxy_pass http://static:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate limit lab (nginx-intermediate) — burst + 429
    location /login {
        limit_req zone=lab_limit burst=5 nodelay;
        proxy_pass http://api:8080/slow;
        proxy_set_header Host $host;
    }

    location / {
        return 200 'nginx lab edge OK\n';
        add_header Content-Type text/plain;
    }
}
