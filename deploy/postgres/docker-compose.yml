# PostgreSQL для курсов postgresql-*
# Primary: localhost:5432  user: course  password: course  db: course

services:
  postgres:
    build: .
    container_name: mock-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course
      POSTGRES_DB: course
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements,pgaudit"
      - "-c"
      - "pgaudit.log=ddl,role"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "log_statement=ddl"
      - "-c"
      - "log_min_duration_statement=500"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course -d course"]
      interval: 5s
      timeout: 3s
      retries: 5

  # pgAdmin — опционально (intermediate+)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mock-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@course.local
      PGADMIN_DEFAULT_PASSWORD: course
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
