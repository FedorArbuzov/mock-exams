# Django course stack: web + postgres + redis
services:
  web:
    build: ./stack/web
    container_name: mock-django-web
    ports:
      - "8092:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://course:course@postgres:5432/course
      REDIS_URL: redis://redis:6379/1
      DJANGO_SECRET_KEY: course-dev-secret-change-in-prod
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: mock-django-postgres
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course
      POSTGRES_DB: course
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course -d course"]
      interval: 3s
      timeout: 3s
      retries: 15
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: mock-django-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - backend

networks:
  backend:

volumes:
  pgdata:
