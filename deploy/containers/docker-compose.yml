# Three-tier stack for containers-basic labs
# docker compose up -d --build

services:
  redis:
    image: redis:7.2-alpine
    container_name: mock-containers-redis
    hostname: redis
    networks:
      - backend

  api:
    build: ./stack/api
    container_name: mock-containers-api
    hostname: api
    environment:
      REDIS_HOST: redis
    networks:
      - backend
      - frontend
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build: ./stack/web
    container_name: mock-containers-web
    hostname: web
    ports:
      - "8088:80"
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy

networks:
  frontend:
  backend:
