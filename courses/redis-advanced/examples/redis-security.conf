# redis-security.conf — учебный фрагмент для redis-advanced
# НЕ использовать как production copy-paste без review
#
# Лаба: courses/redis-advanced/08-lab-rename-commands.md
# Запуск: см. 08-lab (docker run -p 6381:6379 ...)

# --- Сеть (lab: слушаем все; prod: bind internal IP) ---
bind 0.0.0.0
protected-mode yes
port 6379

# --- Память ---
maxmemory 256mb
maxmemory-policy allkeys-lru

# --- Отключение опасных команд ---
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command SHUTDOWN SHUTDOWN_SECRET_b7e2
rename-command CONFIG CONFIG_SECRET_a8f3

# --- ACL (файл встроенный через ACL USERS) ---
# default off — приложения только через user app
user default off
user app on >AppLabPassword ~app:* +@read +@write -@dangerous -@admin
user admin on >AdminLabPassword ~* +@all

# --- Prod extras (закомментировано на lab) ---
# tls-port 6379
# port 0
# tls-cert-file /tls/redis.crt
# tls-key-file /tls/redis.key
# tls-ca-cert-file /tls/ca.crt
# aclfile /etc/redis/users.acl

# --- Логирование отказов ACL ---
acllog-max-len 128
