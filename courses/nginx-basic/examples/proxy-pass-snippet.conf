# Фрагмент для лаб nginx-basic — reverse proxy с префиксом /api/
# Вставлять в server { } на edge; upstream — hostname сервиса в docker compose.

location /api/ {
    proxy_pass http://api:8080/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
}

# Без слэша после порта URI не переписывается:
# location /api/ { proxy_pass http://api:8080; }  → backend получит /api/health
