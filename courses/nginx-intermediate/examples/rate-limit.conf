# Rate limiting — зона в http {}, location в server {}
# Стенд: deploy/nginx/config/nginx.conf + conf.d/00-default.conf

# --- http {} (один раз на весь edge) ---
limit_req_zone $binary_remote_addr zone=lab_limit:10m rate=10r/s;

# --- server {} location /login ---
location /login {
    limit_req zone=lab_limit burst=5 nodelay;
    proxy_pass http://api:8080/slow;
    proxy_set_header Host $host;
}

# Проверка: ab -n 50 -c 10 http://localhost:8080/login/
# Ожидание: часть 200, часть 429 (Too Many Requests)
