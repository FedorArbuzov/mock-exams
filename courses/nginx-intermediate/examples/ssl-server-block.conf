# Пример server {} для TLS termination на стенде deploy/nginx
# После: bash deploy/nginx/scripts/gen-certs.sh
# Фрагмент можно сравнить с config/conf.d/10-tls.conf

server {
    listen 443 ssl;
    server_name localhost lab.local;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Заголовки безопасности (см. 03-security-headers.md)
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # add_header X-Frame-Options "SAMEORIGIN" always;
  # add_header X-Content-Type-Options "nosniff" always;
  # add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /static/ {
        proxy_pass http://static:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 200 'nginx lab TLS OK\n';
        add_header Content-Type text/plain;
    }
}
