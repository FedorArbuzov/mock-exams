# Фрагмент из deploy/containers — сети и зависимости (учебный сниппет)
services:
  api:
    build: ./stack/api
    hostname: api
    networks:
      - backend
      - frontend
    depends_on:
      - redis

  web:
    build: ./stack/web
    ports:
      - "8088:80"
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy

  redis:
    image: redis:7.2-alpine
    networks:
      - backend

networks:
  frontend:
  backend:
