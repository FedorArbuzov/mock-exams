---
- name: DiskPressure runbook
  hosts: k8s
  become: true
  gather_facts: false
  tasks:
    - name: df before
      ansible.builtin.command: df -h /
      register: df_before
      changed_when: false

    - name: Show df
      ansible.builtin.debug:
        var: df_before.stdout_lines

    - name: Run hygiene script if present
      ansible.builtin.command: /usr/local/sbin/nimbus-disk-gc
      register: gc
      changed_when: gc.rc == 0
      failed_when: false

    - name: Vacuum journal if script missing
      ansible.builtin.command: journalctl --vacuum-size=256M
      when: gc.rc | default(1) != 0
      changed_when: true

    - name: Remove lab junk file
      ansible.builtin.file:
        path: /var/tmp/nimbus-junk
        state: absent

    - name: kubelet is active
      ansible.builtin.service:
        name: kubelet
        state: started
