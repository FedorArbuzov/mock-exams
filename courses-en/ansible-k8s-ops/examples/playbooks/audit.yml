---
- name: Monday audit — report only
  hosts: k8s
  become: true
  gather_facts: false
  tasks:
    - name: sshd drop-in exists
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config.d/99-nimbus.conf
      register: sshd_dropin

    - name: sshd drop-in must exist
      ansible.builtin.assert:
        that: sshd_dropin.stat.exists
        fail_msg: "audit: missing 99-nimbus.conf — run site.yml --tags baseline"

    - name: Root login disabled
      ansible.builtin.command: sshd -T
      register: sshd_t
      changed_when: false

    - name: Assert sshd policy
      ansible.builtin.assert:
        that:
          - "'permitrootlogin no' in sshd_t.stdout"
          - "'passwordauthentication no' in sshd_t.stdout"
        fail_msg: "audit: sshd policy drifted"

    - name: nimbus user exists
      ansible.builtin.getent:
        database: passwd
        key: nimbus

    - name: chrony active
      ansible.builtin.command: systemctl is-active chrony
      changed_when: false

    - name: chronyc tracking
      ansible.builtin.command: chronyc tracking
      changed_when: false

    - name: kubelet held
      ansible.builtin.command: dpkg --get-selections kubelet
      register: kubelet_hold
      changed_when: false

    - name: Assert kubelet hold
      ansible.builtin.assert:
        that: "'hold' in kubelet_hold.stdout"
        fail_msg: "audit: kubelet is not held"

    - name: journald drop-in exists
      ansible.builtin.stat:
        path: /etc/systemd/journald.conf.d/nimbus.conf
      register: journal_dropin

    - name: Assert journald drop-in
      ansible.builtin.assert:
        that: journal_dropin.stat.exists
        fail_msg: "audit: missing journald nimbus.conf — run site.yml --tags hygiene"

- name: CP-only audit
  hosts: k8s_cp
  become: true
  gather_facts: false
  tasks:
    - name: etcd snapshot cron exists
      ansible.builtin.cron:
        name: nimbus-etcd-snapshot
      register: etcd_cron
      check_mode: true
      changed_when: false

    - name: List root crontab
      ansible.builtin.command: crontab -l
      register: crontab_l
      changed_when: false
      failed_when: false

    - name: Assert backup cron
      ansible.builtin.assert:
        that: "'nimbus-etcd-snapshot' in crontab_l.stdout"
        fail_msg: "audit: missing etcd cron — run playbooks/backup-cluster.yml"
