# redis-security.conf — training fragment for redis-advanced
# Do NOT use as production copy-paste without review
#
# Lab: courses/redis-advanced/08-lab-rename-commands.md
# Run: see 08-lab (docker run -p 6381:6379 ...)

# --- Network (lab: listen all; prod: bind internal IP) ---
bind 0.0.0.0
protected-mode yes
port 6379

# --- Memory ---
maxmemory 256mb
maxmemory-policy allkeys-lru

# --- Disable dangerous commands ---
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command SHUTDOWN SHUTDOWN_SECRET_b7e2
rename-command CONFIG CONFIG_SECRET_a8f3

# --- ACL (inline via ACL USERS) ---
# default off — apps only via user app
user default off
user app on >AppLabPassword ~app:* +@read +@write -@dangerous -@admin
user admin on >AdminLabPassword ~* +@all

# --- Prod extras (commented out for lab) ---
# tls-port 6379
# port 0
# tls-cert-file /tls/redis.crt
# tls-key-file /tls/redis.key
# tls-ca-cert-file /tls/ca.crt
# aclfile /etc/redis/users.acl

# --- ACL denial logging ---
acllog-max-len 128
