apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: shop
data:
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  LISTEN: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shop
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      containers:
        - name: backend
          image: hashicorp/http-echo:1.0.0
          args:
            - "-text=shop-backend"
            - "-listen=:8080"
          envFrom:
            - configMapRef:
                name: backend-config
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: shop
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8080
