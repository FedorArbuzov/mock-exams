apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: shop
data:
  default.conf: |
    server {
      listen 80;
      location / {
        root /usr/share/nginx/html;
      }
      location /api/ {
        proxy_pass http://backend.shop.svc.cluster.local/;
      }
    }
  index.html: |
    <!doctype html>
    <title>shop</title>
    <p>frontend</p>
    <p>api → /api/</p>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shop
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      containers:
        - name: frontend
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx
          configMap:
            name: frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shop
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
