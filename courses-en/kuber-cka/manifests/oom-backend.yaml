apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cka-20
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: polinux/stress
          args: ["--vm", "1", "--vm-bytes", "80M", "--vm-hang", "1"]
          resources:
            requests:
              memory: 16Mi
              cpu: 50m
            limits:
              memory: 32Mi
              cpu: 200m
