apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cka-14
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      containers:
        - name: backend
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: cka-14
spec:
  selector:
    app: backend-broken
  ports:
    - port: 80
      targetPort: 8080
