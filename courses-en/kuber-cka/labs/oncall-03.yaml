id: oncall-03
title: ON-CALL 03 — Pod-to-Pod networking
track: oncall
namespace: oncall-03
prerequisites:
- type: api_reachable
  desc: Kubernetes API reachable
setup:
- op: ssh
  node: worker-1
  command: ip link set cni0 down 2>/dev/null || ip link set flannel.1 down 2>/dev/null
    || true
initial_state:
- type: api_reachable
  desc: API reachable
task: 'Applications running on different nodes

  cannot communicate with each other.'
root_cause: A CNI bridge/interface was put down on a worker.
hide_root_cause: true
verify:
- type: cni_healthy
  desc: CNI healthy
  points: 5
- type: nodes_ready
  min: 3
  desc: nodes Ready
  points: 5
cleanup:
- op: ssh
  node: worker-1
  command: ip link set cni0 up 2>/dev/null || ip link set flannel.1 up 2>/dev/null
    || true
ticket:
  id: INC-03
  priority: P1
  title: Pod-to-Pod networking
  body: 'Applications running on different nodes

    cannot communicate with each other.'
