id: cka-10-secret
title: Secret
track: cka
namespace: cka-10
prerequisites:
- type: api_reachable
  desc: Kubernetes API reachable
- type: nodes_ready
  min: 3
  desc: all required nodes Ready
- type: coredns_healthy
  desc: CoreDNS healthy
- type: cni_healthy
  desc: CNI healthy
setup:
- op: delete_namespace
  name: cka-10
- op: ensure_namespace
  name: cka-10
initial_state:
- type: namespace_exists
  name: cka-10
  desc: Namespace ready
task: Create Secret db-pass in cka-10 with password=s3cret. Pod app must use it.
verify:
- type: exists
  kind: secret
  name: db-pass
  namespace: cka-10
  desc: Secret exists
  points: 3
- type: env_from_secret
  kind: pod
  name: app
  namespace: cka-10
  value: db-pass
  desc: Pod app uses the Secret
  points: 4
- type: pod_running
  name: app
  namespace: cka-10
  desc: Pod app Running
  points: 3
cleanup:
- op: delete_namespace
  name: cka-10
