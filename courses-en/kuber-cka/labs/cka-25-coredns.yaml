id: cka-25-coredns
title: CKA 25 — Broken CoreDNS
track: troubleshooting
namespace: cka-25
prerequisites:
- type: api_reachable
  desc: Kubernetes API reachable
setup:
- op: kubectl
  args:
  - -n
  - kube-system
  - set
  - image
  - deploy/coredns
  - coredns=nginx:does-not-exist
- op: sleep
  value: '5'
initial_state:
- type: api_reachable
  desc: API reachable
task: CoreDNS is intentionally broken (CrashLoop or Running-but-useless). Find the
  root cause. Restore cluster DNS.
root_cause: CoreDNS image was pointed at a nonexistent image.
hide_root_cause: true
verify:
- type: coredns_healthy
  desc: CoreDNS healthy
  points: 5
- type: dns_resolves
  name: kubernetes.default.svc.cluster.local
  namespace: default
  desc: DNS works
  points: 5
cleanup:
- op: kubectl
  args:
  - -n
  - kube-system
  - rollout
  - undo
  - deploy/coredns
