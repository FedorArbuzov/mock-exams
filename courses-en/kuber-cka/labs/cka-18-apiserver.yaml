id: cka-18-apiserver
title: CKA 18 — API Server timeout
track: troubleshooting
namespace: cka-18
prerequisites:
- type: api_reachable
  desc: Kubernetes API reachable
setup:
- op: tc_delay
  node: control-plane
  value: 2800ms
initial_state:
- type: api_reachable
  desc: API still answers (slowly)
task: kubectl is timing out or extremely slow. Diagnose API endpoint, kube-apiserver,
  etcd. Remove the degradation.
root_cause: netem delay on the control-plane data path.
hide_root_cause: true
verify:
- type: control_plane_healthy
  desc: control plane Running
  points: 5
- type: api_reachable
  desc: API reachable without the injected delay
  points: 5
cleanup:
- op: tc_clear
  node: control-plane
