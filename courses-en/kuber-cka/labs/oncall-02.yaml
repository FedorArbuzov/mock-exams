id: oncall-02
title: ON-CALL 02 — Node NotReady
track: oncall
namespace: oncall-02
prerequisites:
- type: api_reachable
  desc: Kubernetes API reachable
setup:
- op: stop_service
  node: worker-1
  service: kubelet
- op: sleep
  value: '8'
initial_state:
- type: node_not_ready
  node: worker-1
  desc: one worker is not Ready
task: 'One Kubernetes node is NotReady.

  Several workloads are affected.


  Restore cluster health.'
root_cause: kubelet was stopped on a worker.
hide_root_cause: true
verify:
- type: nodes_ready
  min: 3
  desc: all required nodes Ready
  points: 10
cleanup:
- op: start_service
  node: worker-1
  service: kubelet
- op: start_service
  node: worker-1
  service: containerd
ticket:
  id: INC-02
  priority: P1
  title: Node NotReady
  body: 'One Kubernetes node is NotReady.

    Several workloads are affected.


    Restore cluster health.'
