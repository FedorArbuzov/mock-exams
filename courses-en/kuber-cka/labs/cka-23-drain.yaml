id: cka-23-drain
title: CKA 23 — Cordon / drain
track: troubleshooting
namespace: cka-23
prerequisites:
- type: api_reachable
  desc: Kubernetes API reachable
- type: nodes_ready
  min: 3
  desc: all required nodes Ready
- type: coredns_healthy
  desc: CoreDNS healthy
- type: cni_healthy
  desc: CNI healthy
setup:
- op: delete_namespace
  name: cka-23
- op: ensure_namespace
  name: cka-23
- op: apply
  file: manifests/drain-web.yaml
- op: wait
  kind: deployment
  name: web
  namespace: cka-23
initial_state:
- type: deployment_ready
  name: web
  namespace: cka-23
  desc: web is healthy
task: Cordon and drain worker-1 without violating the PDB. web must stay available.
  Node unschedulable. DaemonSets are not your application.
root_cause: Need cordon+drain respecting PDB (not delete --force).
hide_root_cause: true
verify:
- type: node_unschedulable
  node: worker-1
  value: 'true'
  desc: worker-1 cordoned
  points: 4
- type: deployment_ready
  name: web
  namespace: cka-23
  min: 1
  desc: web still Ready
  points: 6
cleanup:
- op: uncordon
  node: worker-1
- op: delete_namespace
  name: cka-23
