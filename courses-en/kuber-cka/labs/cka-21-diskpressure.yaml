id: cka-21-diskpressure
title: CKA 21 — DiskPressure
track: troubleshooting
namespace: cka-21
prerequisites:
- type: api_reachable
  desc: Kubernetes API reachable
setup:
- op: fill_disk
  node: worker-1
  size: 3G
initial_state:
- type: api_reachable
  desc: API reachable
task: A node is under DiskPressure / evicting. Use df, du, inodes, containerd, kubelet
  logs. Free the node.
root_cause: A large fill file under /var/tmp.
hide_root_cause: true
verify:
- type: disk_usage_below
  node: worker-1
  path: /
  max: 90
  desc: root filesystem not full
  points: 6
- type: node_ready
  node: worker-1
  desc: worker Ready
  points: 4
cleanup:
- op: unfill_disk
  node: worker-1
