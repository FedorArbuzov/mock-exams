id: oncall-07
title: ON-CALL 07 — Ingress only works on one node
track: oncall
namespace: oncall-07
prerequisites:
- type: api_reachable
  desc: Kubernetes API reachable
- type: nodes_ready
  min: 3
  desc: all required nodes Ready
- type: coredns_healthy
  desc: CoreDNS healthy
- type: cni_healthy
  desc: CNI healthy
setup:
- op: delete_namespace
  name: oncall-07
- op: ensure_namespace
  name: oncall-07
- op: kubectl
  args:
  - -n
  - oncall-07
  - create
  - deployment
  - frontend
  - --image=nginx:1.27
- op: kubectl
  args:
  - -n
  - oncall-07
  - expose
  - deploy
  - frontend
  - --port=80
  - --name=frontend
- op: kubectl
  args:
  - -n
  - oncall-07
  - create
  - ing
  - app
  - --rule=app.example.com/=frontend:80
  - --class=nginx
- op: kubectl
  args:
  - -n
  - oncall-07
  - patch
  - svc
  - frontend
  - -p
  - '{"spec":{"selector":{"app":"nope"}}}'
initial_state:
- type: exists
  kind: ingress
  name: app
  namespace: oncall-07
  desc: Ingress exists
- type: exists
  kind: service
  name: frontend
  namespace: oncall-07
  desc: Service exists
task: 'Frontend is reachable through one Kubernetes

  node but unavailable through the others.'
root_cause: frontend Service selector no longer matches Pods.
hide_root_cause: true
verify:
- type: selector
  name: frontend
  namespace: oncall-07
  key: app
  value: frontend
  desc: Service selector matches
  points: 4
- type: endpoints
  name: frontend
  namespace: oncall-07
  min: 1
  desc: endpoints populated
  points: 3
- type: ingress_backend
  name: app
  namespace: oncall-07
  value: frontend
  desc: Ingress still points at frontend
  points: 3
cleanup:
- op: delete_namespace
  name: oncall-07
ticket:
  id: INC-07
  priority: P1
  title: Ingress only works on one node
  body: 'Frontend is reachable through one Kubernetes

    node but unavailable through the others.'
