id: oncall-20
title: ON-CALL 20 — Disaster recovery
track: oncall
prerequisites:
- type: api_reachable
  desc: API reachable
- type: snapshot_valid
  path: ~/kuber-cka/etcd-snapshot.db
  desc: backup from CKA 29 exists
setup:
- op: ensure_namespace
  name: cka-30
- op: kubectl
  args:
  - -n
  - cka-30
  - create
  - configmap
  - restore-marker
  - --from-literal=ok=yes
- op: delete_namespace
  name: cka-30
initial_state:
- type: snapshot_valid
  path: ~/kuber-cka/etcd-snapshot.db
  desc: snapshot available
task: 'The etcd data has been lost/corrupted.


  Restore the Kubernetes control plane

  from the available backup.'
verify:
- type: etcd_healthy
  desc: etcd healthy
  points: 4
- type: control_plane_healthy
  desc: API server healthy
  points: 3
- type: nodes_ready
  min: 3
  desc: nodes Ready
  points: 3
cleanup: []
explanation: A full etcd restore is destructive. The grader checks control-plane health
  after you restore. Keep a copy of admin.conf.
ticket:
  id: INC-20
  priority: P1
  title: Disaster recovery
  body: 'The etcd data has been lost/corrupted.


    Restore the Kubernetes control plane

    from the available backup.'
