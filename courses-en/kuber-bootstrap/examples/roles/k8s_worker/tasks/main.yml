---
- name: Join command from control plane
  ansible.builtin.command: kubeadm token create --print-join-command
  register: k8s_join
  changed_when: false
  delegate_to: "{{ groups['k8s_cp'][0] }}"

- name: kubeadm join
  ansible.builtin.shell: "{{ k8s_join.stdout }}"
  args:
    creates: /etc/kubernetes/kubelet.conf
    executable: /bin/bash
