apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "checkout-app"
        vault.hashicorp.com/agent-inject-secret-db: "secret/data/checkout/db"
        vault.hashicorp.com/agent-inject-template-db: |
          {{- with secret "secret/data/checkout/db" -}}
          password={{ .Data.data.password }}
          user={{ .Data.data.user }}
          {{- end -}}
    spec:
      serviceAccountName: checkout-app
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo alive; sleep 30; done"]
