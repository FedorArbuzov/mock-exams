[project]
name = "shop-lab"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "httpx>=0.28",
    "hypothesis>=6.100",
    "freezegun>=1.5",
    "responses>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs docker or external service",
    "slow: long-running tests",
]

[tool.coverage.run]
source = ["src/shop"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
