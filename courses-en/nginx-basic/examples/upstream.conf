# upstream snippet — lab 09, final project
# Hostnames are service names in docker compose (DNS 127.0.0.11).

upstream api_backends {
    least_conn;
    server api:8080 max_fails=2 fail_timeout=10s;
    # Second instance for the lab (after scale or a separate api2 service):
    # server api2:8080 max_fails=2 fail_timeout=10s;
    keepalive 8;
}

server {
    listen 80;
    # server_name ...

    location /api/ {
        proxy_pass http://api_backends/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
