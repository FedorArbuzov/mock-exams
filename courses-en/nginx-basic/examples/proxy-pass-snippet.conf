# Snippet for the nginx-basic labs — reverse proxy with the /api/ prefix
# Paste inside server { } on the edge; upstream is the service hostname in docker compose.

location /api/ {
    proxy_pass http://api:8080/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
}

# Without the trailing slash after the port the URI is not rewritten:
# location /api/ { proxy_pass http://api:8080; }  → backend receives /api/health
