# pgBackRest template — adapt for prod
# Documentation: https://pgbackrest.org/configuration.html

[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
log-level-console=info
start-fast=y

[course]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres

# S3 example (uncomment for cloud):
# repo1-type=s3
# repo1-s3-bucket=pg-backups
# repo1-s3-endpoint=s3.amazonaws.com
# repo1-s3-key=<key>
# repo1-s3-key-secret=<secret>
