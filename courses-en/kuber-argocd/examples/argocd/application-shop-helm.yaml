apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-helm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: YOUR_GITOPS_REPO
    targetRevision: HEAD
    path: charts/shop
    helm:
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-argocd-helm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
