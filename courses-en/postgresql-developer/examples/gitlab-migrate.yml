# Snippet of .gitlab-ci.yml — Flyway migrations (postgresql-developer lesson 14)
migrate:
  stage: deploy
  image: flyway/flyway:10
  variables:
  script:
    - flyway -url=jdbc:postgresql://postgres:5432/course -user=course -password=course -schemas=devapp -locations=filesystem:sql migrate
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
