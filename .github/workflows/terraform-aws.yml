name: terraform-aws

on:
  pull_request:
    paths:
      - "courses/aws-terraform/projects/**"
      - ".github/workflows/terraform-aws.yml"
  push:
    branches: [main]
    paths:
      - "courses/aws-terraform/projects/**"
      - ".github/workflows/terraform-aws.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: courses/aws-terraform/projects/image-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Build lambda zip (handler only, no Pillow in CI)
        run: |
          cd lambda
          zip -j ../lambda.zip handler.py

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  plan-localstack:
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: courses/aws-terraform/projects/image-pipeline
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: s3,lambda,dynamodb,iam,logs,sts
          DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Build lambda zip
        run: |
          cd lambda
          zip -j ../lambda.zip handler.py

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform plan
        run: |
          terraform plan -input=false \
            -var="bucket_name=ci-test-bucket-${{ github.run_id }}" \
            -var="use_localstack=true" \
            -var="localstack_endpoint=http://localhost:4566"
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
